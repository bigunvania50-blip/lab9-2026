<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
</head>
<body>
    <h1>My To-Do List</h1>

    <ul>
        {% for task in tasks %}
            <li>
                {% if task.done %}
                    <strike>{{ task.content }}</strike>
                {% else %}
                    {{ task.content }}
                {% endif %}
                <a href="{% url 'mark_done' task.id %}">Done</a>
                <a href="{% url 'delete_task' task.id %}">Delete</a>
            </li>
        {% endfor %}
    </ul>

    <h2>Add New Task</h2>
    <form method="post" action="{% url 'add_task' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Add Task</button>
    </form>
</body>
</html>
