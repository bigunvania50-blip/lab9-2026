<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Записник контактів</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            margin: 0;
            padding: 30px 15px;
            color: #222;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        .card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
            font-size: 20px;
            color: #34495e;
        }

        form.add-form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

            form.add-form input {
                flex: 1 1 160px;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 6px;
                font-size: 15px;
            }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            color: #fff;
            cursor: pointer;
        }

        .btn-add {
            background: #27ae60;
        }

            .btn-add:hover {
                background: #1e8449;
            }

        .btn-delete {
            background: #e74c3c;
            padding: 6px 12px;
            font-size: 14px;
        }

            .btn-delete:hover {
                background: #c0392b;
            }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #e3e6ea;
        }

        th {
            background: #34495e;
            color: #fff;
        }

        tr:hover td {
            background: #f7f9fb;
        }

        .empty {
            text-align: center;
            color: #888;
            padding: 15px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Записник контактів</h1>

        <div class="card">
            <h2>Додати контакт</h2>
            <form class="add-form" action="{{ url_for('add') }}" method="post">
                <input type="text" name="name" placeholder="Ім'я" required>
                <input type="tel" name="phone" placeholder="Номер телефону" required>
                <input type="email" name="email" placeholder="Email" required>
                <button class="btn-add" type="submit">Додати</button>
            </form>
        </div>

        <div class="card">
            <h2>Список контактів</h2>
            {% if contacts %}
            <table>
                <tr>
                    <th>Ім'я</th>
                    <th>Номер телефону</th>
                    <th>Email</th>
                    <th></th>
                </tr>
                {% for contact in contacts %}
                <tr>
                    <td>{{ contact.name }}</td>
                    <td>{{ contact.phone }}</td>
                    <td>{{ contact.email }}</td>
                    <td>
                        <form action="{{ url_for('delete', contact_id=contact.id) }}" method="post"
                              onsubmit="return confirm('Видалити контакт?');">
                            <button class="btn-delete" type="submit">Видалити</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </table>
            {% else %}
            <p class="empty">Контактів поки немає. Додайте перший!</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
