<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
</head>
<body>
    <h1>My To-Do List</h1>

    <ul>
        {% for task in tasks %}
            <li>
                {% if task.done %}
                    <strike>{{ task.content }}</strike>
                {% else %}
                    {{ task.content }}
                {% endif %}
                <a href="{{ url_for('done', id=task.id) }}">Done</a>
                <a href="{{ url_for('delete', id=task.id) }}">Delete</a>
            </li>
        {% endfor %}
    </ul>

    <h2>Add New Task</h2>
    <form action="{{ url_for('add') }}" method="post">
        <input type="text" name="content" placeholder="Enter task description">
        <button type="submit">Add Task</button>
    </form>
</body>
</html>
